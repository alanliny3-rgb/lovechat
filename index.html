<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>アイチャット</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff7ba9' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3C14.7 3 13.5 3.5 12 5c-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7 7-7z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- 登录卡 -->
  <div id="loginView" class="card login-card">
    <h2><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3C14.7 3 13.5 3.5 12 5c-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7 7-7z"/></svg>登录 / 注册</h2>
    <input id="li-username" placeholder="用户名" />
    <input id="li-password" type="password" placeholder="密码" />
    <!-- 前端仅检查是否填写 后端负责校验有效性 -->
    <input id="li-code" placeholder="邀请码" value="" />

    <div class="row">
      <button id="btn-register" class="btn">注册</button>
      <button id="btn-login" class="btn">登录</button>
    </div>
    <p class="note">注册请输入邀请码 设置相较简短的账号密码</p>
  </div>


  <!-- 主界面 -->
  <div id="app" class="app" style="display:none">

    <header class="topbar">
      <div class="left">
        <div id="meName" class="me-name">用户名</div>
        <div id="statusText" class="small muted">已登录</div>
      </div>
      <div class="right">
        <button id="btn-logout" class="btn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 21H6.5A2.5 2.5 0 0 1 4 18.5v-13A2.5 2.5 0 0 1 6.5 3h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>登出</button>
      </div>
    </header>

    <main class="main">
      <!-- 消息 tab -->
      <section id="tab-messages" class="tab view active">
        <div id="conversationsPanel" class="panel pad">
          <div class="title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4 3v-3H6.5A2.5 2.5 0 0 1 4 14.5v-8z"/><circle cx="9" cy="10.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="12.5" cy="10.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="16" cy="10.5" r="0.9" fill="currentColor" stroke="none"/></svg>会话</div>
          <div id="conversationsList" class="list"></div>
        </div>

        <div id="chatPanel" class="panel pad" style="display:none">
          <div class="chat-header" style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px">
              <button id="backToConvos" class="btn small outline"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>返回</button>
              <div>
                <div id="chatTitle">请选择会话</div>
                <div id="friendRemarkDisplay" class="small muted"></div>
              </div>
            </div>
          </div>

          <div id="chatWindow" class="chat-window"></div>

  <div class="composer">
    <div class="row text-send">
      <button id="btnMore" class="icon-btn" type="button" title="更多"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></button>
      <input id="msgInput" placeholder="输入消息并回车发送" />
      <div id="imageRow" class="row image-send">
        <button id="btnSendImage" class="btn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><circle cx="9" cy="10" r="1.7"/><path d="M20.5 15.5L16 10.5 6 19.5"/></svg>发送图片</button>
        <input type="file" id="imgUpload" accept="image/*" />
      </div>
      <button id="btnSendText" class="btn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2.5L11 13.5"/><path d="M22 2.5L15 21.5 11 13.5 2 9.5z"/></svg>发送</button>
    </div>
  </div>

        </div>
      </section>

      <!-- 联系人 tab -->
      <section id="tab-contacts" class="tab view">
        <div class="panel pad">
          <div class="title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.5" cy="8" r="3"/><path d="M4.2 18.5c.9-2.8 2.9-4.2 5.3-4.2s4.4 1.4 5.3 4.2"/><path d="M18 12v6"/><path d="M15 15h6"/></svg>添加联系人</div>
          <div class="row" style="gap:8px">
            <input id="newFriend" placeholder="添加好友用户名" />
            <button id="btn-add" class="btn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.5" cy="8" r="3"/><path d="M4.2 18.5c.9-2.8 2.9-4.2 5.3-4.2s4.4 1.4 5.3 4.2"/><path d="M18 12v6"/><path d="M15 15h6"/></svg>添加</button>
          </div>
        </div>

        <div class="panel pad">
          <div class="title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.8 19c.9-2.9 2.7-4.3 5.2-4.3 2.4 0 4.3 1.4 5.2 4.3"/><circle cx="16.8" cy="9.5" r="2.3"/><path d="M16.2 14.9c1.7.2 3.2 1.2 4 2.9"/></svg>联系人</div>
          <div id="friendsList" class="list"></div>
        </div>
      </section>

      <!-- 我 tab -->
      <section id="tab-me" class="tab view">
        <div class="panel pad">
          <div class="title"></div>
          <div class="profile-row">
            <div id="meAvatarWrap" class="avatar-wrap"></div>
            <div style="flex:1">
              <input id="avatarInput" placeholder="头像外链 (示例: https://...) 或点下方上传本地图片" />
              <div class="row" style="margin-top:8px">
                <button id="btnUploadAvatar" class="btn">上传图片</button>
                <button id="btnSaveAvatar" class="btn">保存头像</button>
              </div>
            </div><div><a href="https://wallpaperscraft.com/catalog/anime" target="_blank">图库1</a>
            <br><a href="https://anime-pictures.net/" target="_blank">图库2</a>
            </div>
          </div>
          <input type="file" id="avatarUpload" accept="image/*" style="display:none" />
        </div>

        <div class="panel pad">
          <div class="title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>消息通知</div>
          <div class="profile-row">
            <div style="flex:1">
              <div id="notifyStatus" class="small muted">检测中...</div>
            </div>
            <button id="btnNotifyToggle" class="btn small">开启通知</button>
          </div>
        </div>

        <div class="panel pad">
          <div class="title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5l1.7 3.8 3.8 1.7-3.8 1.7L12 15.5l-1.7-3.8-3.8-1.7 3.8-1.7L12 4.5z"/></svg>开发者说明</div>
          <textarea id="meNote" readonly rows="6">
          冷少的世界
          </textarea>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-target="tab-messages" id="nav-msg">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4 3v-3H6.5A2.5 2.5 0 0 1 4 14.5v-8z"/><circle cx="9" cy="10.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="12.5" cy="10.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="16" cy="10.5" r="0.9" fill="currentColor" stroke="none"/></svg>
        <span class="nav-badge" id="navMsgBadge"></span>
        <span>消息</span>
      </button>
      <button class="nav-btn" data-target="tab-contacts" id="nav-contacts">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.8 19c.9-2.9 2.7-4.3 5.2-4.3 2.4 0 4.3 1.4 5.2 4.3"/><circle cx="16.8" cy="9.5" r="2.3"/><path d="M16.2 14.9c1.7.2 3.2 1.2 4 2.9"/></svg>
        <span>联系人</span>
      </button>
      <button class="nav-btn" data-target="tab-me" id="nav-me">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.2" r="3.5"/><path d="M5.2 19.5c1.2-3.4 3.6-5 6.8-5s5.6 1.6 6.8 5"/></svg>
        <span>我</span>
      </button>
    </nav>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="./app.js"></script>

  </body>
  </html>
